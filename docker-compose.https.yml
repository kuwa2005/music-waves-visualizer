# visualizer 静的HTML版をHTTPS(8443)で配信
# 使い方:
#   1. ./generate-ssl-cert.sh 192.168.0.234  # サーバーIPで証明書生成
#   2. docker compose -f docker-compose.https.yml up -d --build
# アクセス: https://<サーバーIP>:8443/visualizer/
# ※自己署名証明書のため、ブラウザで「詳細」→「安全でないサイトへ」で進む必要があります

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.static
    container_name: music-waves-visualizer
    ports:
      - "8443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
